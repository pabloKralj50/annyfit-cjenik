name: Dnevni cjenik
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cjenik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generiraj cjenik
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          CJENIK_ADRESA: ${{ vars.CJENIK_ADRESA }}
          CJENIK_MJESTO: ${{ vars.CJENIK_MJESTO }}
          CJENIK_OZNAKA: ${{ vars.CJENIK_OZNAKA }}
          CJENIK_BROJ_POHRANE: ${{ vars.CJENIK_BROJ_POHRANE }}
        run: python3 generate_cjenik.py
      - name: Spremi u repozitorij
        run: |
          git config user.name "cjenik-bot"
          git config user.email "cjenik-bot@users.noreply.github.com"
          git add -A
          git commit -m "Cjenik $(date -u +%F)" || echo "nema promjena"
          git push
